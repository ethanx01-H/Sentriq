services:
  sentriq:
    build: .
    # Overridable so production can run a published image instead of a local
    # build: SENTRIQ_IMAGE=registry.aya.com.mm/sentriq:1.4.3 docker compose pull
    # followed by `up -d --no-build`. Without it, a local build keeps working.
    image: ${SENTRIQ_IMAGE:-sentriq:local}
    env_file: .env
    environment:
      # Production by default: the guards in sentriq/config.py refuse a
      # placeholder key, a non-Secure cookie, a missing ALLOWED_HOSTS and
      # several workers without Redis, so the safe values are the ones you get
      # by doing nothing. For a localhost review, set APP_ENV=review and
      # COOKIE_SECURE=0 in .env (see the block at the end of .env.example).
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # The domain this is served on; every other Host header is refused.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in .env to the domain, e.g. sentriq.aya.com.mm}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # One worker unless a shared store is configured: N workers without Redis
      # multiply every rate limit by N, and a lockout only covers the worker
      # that saw the failed attempt. Set REDIS_URL and --profile redis to scale.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      REDIS_URL: ${REDIS_URL:-}
      # TRUSTED_PROXIES is deliberately not defaulted here. It must be the single
      # address the host proxy connects from (the Docker bridge gateway), and the
      # app refuses to start in production without it: see .env.example.
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Host directories, not Docker volumes, on purpose:
      # `docker compose down -v`, `docker volume rm`, `docker volume prune` and
      # `docker system prune --volumes` only ever remove Docker-managed volumes,
      # so none of them can delete the team's alerts or evidence.
      - ./data:/app/data
      - ${SENTRIQ_BACKUP_DIR:-./backups}:/app/backups
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentriq}
      POSTGRES_USER: ${POSTGRES_USER:-sentriq}
      # No fallback on purpose: a database that starts with a published default
      # password is the quietest way to lose a SOC's ticket history. It must
      # match the password inside DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env and use the same value in DATABASE_URL}
    volumes:
      # A host directory again, so `docker compose down -v` cannot delete the
      # database. Back it up like any other Postgres server.
      - ${SENTRIQ_PGDATA_DIR:-./pgdata}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentriq} -d ${POSTGRES_DB:-sentriq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    # Counters are ephemeral by design: losing them costs one window of rate
    # limiting, not any ticket data, so persistence is off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
