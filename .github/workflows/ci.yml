name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      # The suite starts its own bundled Postgres (pgserver) and migrates a
      # template database, so no service container is needed and the tests run
      # against the same engine production does.
      - name: Run the suite
        run: python -m pytest -q
        env:
          APP_ENV: review

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  image:
    name: Image build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: |
          cp .env.example .env
          # The shipped placeholder key is refused by the app on purpose; compose
          # only interpolates, so this proves the file resolves and every
          # required variable is present.
          docker compose config > /dev/null
          echo "compose file resolves"
      - name: Build
        run: docker build -t sentriq:ci .
      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentriq:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the repository for misconfiguration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint sh sentriq:ci -c '
            set -eu
            test -f /app/main.py
            test -f /app/sentriq/worker.py
            python -c "import sentriq.worker; print(\"worker import ok\")"
            python -c "import cryptography; print(\"cryptography ok\")"
          '
