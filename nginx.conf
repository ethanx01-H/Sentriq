# Example host-level Nginx site for a domain deployment.
#
# DNS:      sentriq.example.com  ->  this host
# TLS:      obtain a certificate first (certbot --nginx -d sentriq.example.com)
# App:      docker compose binds the app to 127.0.0.1:8080, so only this proxy
#           can reach it. Keep it that way; never publish 8080 on the LAN.
# App env:  ALLOWED_HOSTS=sentriq.example.com
#           COOKIE_SECURE=1, APP_ENV=production, PUBLIC_BASE_URL=https://sentriq.example.com
#           TRUSTED_PROXIES must cover the address this proxy connects from.
#
# The session cookie is named __Host-session in production, which requires
# Secure, Path=/ and no Domain attribute. Do not add one here.

limit_req_zone $binary_remote_addr zone=sentriq_login:10m rate=10r/m;

upstream sentriq_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sentriq.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sentriq.example.com;

    ssl_certificate     /etc/letsencrypt/live/sentriq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sentriq.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Evidence uploads: keep in step with MAX_REQUEST_BYTES.
    client_max_body_size 25m;
    client_body_timeout 60s;

    # The app sets these too; repeating them here means a direct hit on the app
    # port (or a misconfigured proxy) still answers safely.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Do not advertise the origin server or its version.
    server_tokens off;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    location = /login/ {
        limit_req zone=sentriq_login burst=10 nodelay;
        proxy_pass http://sentriq_app;
        include /etc/nginx/proxy_params;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://sentriq_app;
        include /etc/nginx/proxy_params;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
